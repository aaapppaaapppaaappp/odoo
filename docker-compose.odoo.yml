services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME:-odoo}
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      POSTGRES_INITDB_ARGS: "--locale=C"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo} -d ${ODOO_DB_NAME:-odoo}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    # image: odoo:19.0-20260217
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # command: [ "odoo", "-i", "base" ]
    environment:
      ODOO_DB_HOST: db
      ODOO_DB_PORT: 5432
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo}
      ODOO_HTTP_INTERFACE: 0.0.0.0
      ODOO_HTTP_PORT: 8069
      ODOO_ADDONS_PATH: /opt/odoo/addons,/opt/hireme_odoo_addons
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../hireme_odoo_addons:/opt/hireme_odoo_addons

volumes:
  odoo-db-data:
  odoo-web-data:
